<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Exam - Exam Platform</title>
    <link rel="stylesheet" href="../public/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="exam-creation-body">
    <div class="create-exam-container">
        <header class="exam-creation-header">
            <div class="header-content">
                <h1><i class="fas fa-file-alt"></i> Create New Exam</h1>
                <a href="dashboard.html" class="back-to-dashboard">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>
        </header>

        <form id="examCreationForm" class="exam-creation-form">
            <!-- Exam Details Section -->
            <section class="form-section exam-details">
                <h2>Exam Details</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="examName">Exam Name</label>
                        <input type="text" id="examName" name="examName" 
                               placeholder="Enter exam name" required 
                               maxlength="100">
                    </div>
                    <div class="form-group">
                        <label for="targetField">Target Field</label>
                        <select id="targetField" name="targetField" required>
                            <option value="" disabled selected>Select Field</option>
                            <option value="sma">SMA</option>
                            <option value="smi">SMI</option>
                            <option value="bcg">BCG</option>
                            <option value="spa">SPA</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="targetSemester">Target Semester</label>
                        <select id="targetSemester" name="targetSemester" required>
                            <option value="" disabled selected>Select Semester</option>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="targetGroup">Group (Optional)</label>
                        <input type="text" id="targetGroup" name="targetGroup" 
                               placeholder="e.g., Group A">
                    </div>
                </div>
            </section>

            <!-- Questions Section -->
            <section class="form-section exam-questions">
                <div class="questions-header">
                    <h2>Questions</h2>
                    <button type="button" class="btn add-question-btn" id="addQuestionBtn">
                        <i class="fas fa-plus"></i> Add Question
                    </button>
                </div>
                
                <div id="questionContainer" class="question-container">
                    <!-- Dynamically added questions will appear here -->
                </div>
            </section>

            <!-- Form Actions -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="createExamBtn">
                    <i class="fas fa-save"></i> Create Exam
                </button>
            </div>
        </form>
    </div>

    <!-- Question Type Modal -->
    <div id="questionTypeModal" class="modal">
        <div class="modal-content">
            <h2>Select Question Type</h2>
            <div class="question-type-options">
                <button class="btn question-type-btn" data-type="mcq">
                    <i class="fas fa-list"></i>
                    <span>Multiple Choice</span>
                    <small>Select from options</small>
                </button>
                <button class="btn question-type-btn" data-type="direct">
                    <i class="fas fa-pen"></i>
                    <span>Direct Answer</span>
                    <small>Enter correct answer</small>
                </button>
            </div>
            <button class="btn close-modal-btn" id="closeQuestionTypeModal">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <!-- Question Creation Modal -->
    <div id="questionCreationModal" class="modal">
        <div class="modal-content">
            <h2>Create Question</h2>
            <form id="questionForm">
                <div class="form-group">
                    <label for="questionText">Question Text</label>
                    <textarea id="questionText" name="questionText" required></textarea>
                </div>
                <div id="optionsContainer" class="form-group">
                    <!-- Dynamically added options for MCQ questions -->
                </div>
                <div class="form-group">
                    <label for="correctAnswer">Correct Answer</label>
                    <input type="text" id="correctAnswer" name="correctAnswer" required>
                </div>
                <div class="form-group">
                    <label for="points">Points</label>
                    <input type="number" id="points" name="points" min="0" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Add Question</button>
                    <button type="button" class="btn btn-secondary" id="cancelQuestionBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Question Edit Modal -->
    <div id="questionEditModal" class="modal">
        <div class="modal-content">
            <h2>Edit Question</h2>
            <form id="questionEditForm">
                <input type="hidden" id="editQuestionIndex" name="editQuestionIndex">
                <div class="form-group">
                    <label for="editQuestionText">Question Text</label>
                    <textarea id="editQuestionText" name="editQuestionText" required></textarea>
                </div>
                <div id="editOptionsContainer" class="form-group">
                    <!-- Dynamically added options for MCQ questions -->
                </div>
                <div class="form-group">
                    <label for="editCorrectAnswer">Correct Answer</label>
                    <input type="text" id="editCorrectAnswer" name="editCorrectAnswer" required>
                </div>
                <div class="form-group">
                    <label for="editPoints">Points</label>
                    <input type="number" id="editPoints" name="editPoints" min="0" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <button type="button" class="btn btn-secondary" id="cancelEditBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../public/js/create_exam.js"></script>
</body>
</html>
