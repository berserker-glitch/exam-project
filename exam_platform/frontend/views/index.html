<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Platform</title>
    <link rel="stylesheet" href="../public/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container center-content">
        <!-- Main Welcome Card -->
        <div class="auth-container">
            
            <!--prolly to do later-->
            <!-- Logo Section 
            <div class="logo-section">
                <img src="/images/logo.png" alt="Platform Logo" class="platform-logo">
            </div> -->

            <!-- Welcome Message -->
            <div class="welcome-message">
                <h1>Welcome to Our Platform</h1>
                <p>Exam's community</p>
            </div>

            <!-- Authentication Buttons -->
            <div class="button-group">
                <a href="login.html" class="btn login-btn">Login</a>
                <a href="signup.html" class="btn signup-btn">Sign Up</a>
            </div>

            <!-- Features Section -->
            <div class="features-grid">

                </div>
                <div class="feature-card">
                    <i class="feature-icon progress-icon"></i>
                    <h3>Track Progress</h3>
                    <p>Monitor your performance</p>

            </div>

            <!-- Footer Section -->
            <div class="form-footer">

            </div>
