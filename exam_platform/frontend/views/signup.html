<!--
    Page d'Inscription
    
    Cette page gère l'inscription des nouveaux utilisateurs avec les fonctionnalités suivantes :
    - Collecte complète d'informations utilisateur
    - Exigences strictes pour les mots de passe
    - Validation des mots de passe en temps réel
    - Validation des champs
    - Design responsive
    - Intégration avec l'API d'inscription backend
    
    Champs du formulaire :
    - Nom complet
    - Email
    - Date de naissance
    - Sexe
    - Filière d'études
    - Semestre
    - Mot de passe avec exigences
    - Confirmation du mot de passe
    
    Dépendances :
    - style.css : Styles personnalisés pour le formulaire d'inscription
    - main.js : Validation de formulaire, vérification de mot de passe et intégration API
    - Police Poppins de Google Fonts
-->

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - EC</title>
    <!-- External stylesheets -->
    <link rel="stylesheet" href="../public/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Main authentication container -->
    <div class="auth-container">
        <!-- Welcome message section -->
        <div class="welcome-message">
            <h1>Créer un Compte</h1>
            <p>Rejoignez notre communauté</p>
        </div>
        
        <!-- Registration form with client-side validation -->
        <form id="signupForm" onsubmit="return validateSignup(event)">
            <!-- Personal Information Section -->
            <div class="form-group">
                <label for="fullName">Nom Complet</label>
                <input type="text" id="fullName" name="fullName" required placeholder="Entrez votre nom complet">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Entrez votre email">
            </div>
            <div class="form-group">
                <label for="dob">Date de Naissance</label>
                <input type="date" id="dob" name="dob" required 
                    max="2006-12-31" 
                    min="1950-01-01" 
                    onchange="validateAge(this.value)"
                    class="date-input">
                <small class="date-hint">Vous devez avoir au moins 18 ans</small>
            </div>
            
            <!-- Demographic Information -->
            <div class="form-group">
                <label for="sex">Sexe</label>
                <select id="sex" name="sex" required>
                    <option value="">Sélectionnez votre sexe</option>
                    <option value="male">Masculin</option>
                    <option value="female">Féminin</option>
                </select>
            </div>
            
            <!-- Academic Information -->
            <div class="form-group">
                <label for="filiere">Filière d'Études</label>
                <select id="filiere" name="filiere" required>
                    <option value="">Sélectionnez votre filière</option>
                    <option value="sma">SMA</option>
                    <option value="smi">SMI</option>
                    <option value="bcg">BCG</option>
                    <option value="spa">SPA</option>
                </select>
            </div>
            <div class="form-group">
                <label for="studyYear">Semestre</label>
                <select id="studyYear" name="studyYear" required>
                    <option value="">Sélectionnez votre semestre</option>
                    <option value="1">Semestre 1</option>
                    <option value="2">Semestre 2</option>
                    <option value="3">Semestre 3</option>
                    <option value="4">Semestre 4</option>
                    <option value="5">Semestre 5</option>
                    <option value="6">Semestre 6</option>
                </select>
            </div>
            
            <!-- Password Section with Requirements -->
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <div class="password-input-container">
                    <input type="password" id="password" name="password" required 
                           placeholder="Entrez votre mot de passe"
                           pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*]).{8,}"
                           onkeyup="checkPassword(this.value)">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password')">
                        <svg class="eye-icon" viewBox="0 0 24 24" width="24" height="24">
                            <path class="eye-open" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            <path class="eye-closed" d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- Password Requirements List -->
            <div class="password-requirements">
                <p>Le mot de passe doit contenir :</p>
                <ul>
                    <li id="length">Au moins 8 caractères</li>
                    <li id="lowercase">Une lettre minuscule</li>
                    <li id="uppercase">Une lettre majuscule</li>
                    <li id="number">Un chiffre</li>
                    <li id="special">Un caractère spécial (!@#$%^&*)</li>
                </ul>
            </div>
            
            <!-- Password Confirmation -->
            <div class="form-group">
                <label for="confirmPassword">Confirmer le Mot de passe</label>
                <div class="password-input-container">
                    <input type="password" id="confirmPassword" name="confirmPassword" required 
                           placeholder="Confirmez votre mot de passe">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmPassword')">
                        <svg class="eye-icon" viewBox="0 0 24 24" width="24" height="24">
                            <path class="eye-open" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            <path class="eye-closed" d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" class="btn signup-btn">Créer un Compte</button>
        </form>
        
        <!-- Login Link -->
        <div class="form-footer">
            <p>Vous avez déjà un compte ? <a href="login.html">Connexion</a></p>
        </div>
    </div>

    <!-- JavaScript for form handling and validation -->
    <script src="../public/js/main.js"></script>
</body>
</html>
