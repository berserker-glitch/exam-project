<!--
    Sign Up Page
    
    This page handles new user registration with the following features:
    - Comprehensive user information collection
    - Strong password requirements
    - Real-time password validation
    - Field validation
    - Responsive design
    - Integration with backend registration API
    
    Form Fields:
    - Full Name
    - Email
    - Date of Birth
    - Sex (Gender)
    - Field of Study (Filière)
    - Semester
    - Password with requirements
    - Password confirmation
    
    Dependencies:
    - style.css: Custom styles for the signup form
    - main.js: Form validation, password checking, and API integration
    - Poppins font from Google Fonts
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - EC</title>
    <!-- External stylesheets -->
    <link rel="stylesheet" href="../public/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Main authentication container -->
    <div class="auth-container">
        <!-- Welcome message section -->
        <div class="welcome-message">
            <h1>Create Account</h1>
            <p>Join our community</p>
        </div>
        
        <!-- Registration form with client-side validation -->
        <form id="signupForm" onsubmit="return validateSignup(event)">
            <!-- Personal Information Section -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required 
                    max="2006-12-31" 
                    min="1950-01-01" 
                    onchange="validateAge(this.value)"
                    class="date-input">
                <small class="date-hint">You must be at least 18 years old</small>
            </div>
            
            <!-- Demographic Information -->
            <div class="form-group">
                <label for="sex">Sex</label>
                <select id="sex" name="sex" required>
                    <option value="">Select your sex</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>
            
            <!-- Academic Information -->
            <div class="form-group">
                <label for="filiere">Field of Study (Filière)</label>
                <select id="filiere" name="filiere" required>
                    <option value="">Select your field</option>
                    <option value="sma">SMA</option>
                    <option value="smi">SMI</option>
                    <option value="bcg">BCG</option>
                    <option value="spa">SPA</option>
                </select>
            </div>
            <div class="form-group">
                <label for="studyYear">Semester</label>
                <select id="studyYear" name="studyYear" required>
                    <option value="">Select your semester</option>
                    <option value="1">Semester 1</option>
                    <option value="2">Semester 2</option>
                    <option value="3">Semester 3</option>
                    <option value="4">Semester 4</option>
                    <option value="5">Semester 5</option>
                    <option value="6">Semester 6</option>
                </select>
            </div>
            
            <!-- Password Section with Requirements -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input-container">
                    <input type="password" id="password" name="password" required 
                           placeholder="Enter your password"
                           pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*]).{8,}"
                           onkeyup="checkPassword(this.value)">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password')">
                        <svg class="eye-icon" viewBox="0 0 24 24" width="24" height="24">
                            <path class="eye-open" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            <path class="eye-closed" d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- Password Requirements List -->
            <div class="password-requirements">
                <p>Password must contain:</p>
                <ul>
                    <li id="length">At least 8 characters</li>
                    <li id="lowercase">One lowercase letter</li>
                    <li id="uppercase">One uppercase letter</li>
                    <li id="number">One number</li>
                    <li id="special">One special character (!@#$%^&*)</li>
                </ul>
            </div>
            
            <!-- Password Confirmation -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-input-container">
                    <input type="password" id="confirmPassword" name="confirmPassword" required 
                           placeholder="Confirm your password">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmPassword')">
                        <svg class="eye-icon" viewBox="0 0 24 24" width="24" height="24">
                            <path class="eye-open" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            <path class="eye-closed" d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" class="btn signup-btn">Create Account</button>
        </form>
        
        <!-- Login Link -->
        <div class="form-footer">
            <p>Already have an account? <a href="login.html">Login</a></p>
        </div>
    </div>

    <!-- JavaScript for form handling and validation -->
    <script src="../public/js/main.js"></script>
</body>
</html>
