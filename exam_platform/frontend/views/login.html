<!--
    Page de Connexion
    
    Cette page gère l'authentification des utilisateurs avec les fonctionnalités suivantes :
    - Connexion basée sur l'email et le mot de passe
    - Validation de formulaire
    - Design responsive
    - Interface utilisateur propre et moderne
    - Intégration avec l'API d'authentification backend
    - Redirection vers l'inscription pour les nouveaux utilisateurs
    
    Dépendances :
    - style.css : Styles personnalisés pour le formulaire de connexion
    - main.js : Validation de formulaire et intégration API
    - Police Poppins de Google Fonts
-->

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - EC</title>
    <!-- External stylesheets -->
    <link rel="stylesheet" href="../public/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Main authentication container -->
    <div class="auth-container">
        <!-- Welcome message section -->
        <div class="welcome-message">
            <h1>Bon Retour</h1>
            <p>Connectez-vous à votre compte</p>
        </div>
        
        <!-- Login form with client-side validation -->
        <form id="loginForm" onsubmit="return validateLogin(event)">
            <!-- Email input field -->
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Entrez votre email">
            </div>
            
            <!-- Password input field -->
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <div class="password-input-container">
                    <input type="password" id="password" name="password" required placeholder="Entrez votre mot de passe">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password')">
                        <svg class="eye-icon" viewBox="0 0 24 24" width="24" height="24">
                            <path class="eye-open" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            <path class="eye-closed" d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- Submit button -->
            <button type="submit" class="btn login-btn">Connexion</button>
        </form>
        
        <!-- Sign up link for new users -->
        <div class="form-footer">
            <p>Vous n'avez pas de compte ? <a href="signup.html">S'inscrire</a></p>
        </div>
    </div>

    <!-- JavaScript for form handling and validation -->
    <script src="../public/js/main.js"></script>
</body>
</html>
